<script>
var rsPosted = false;
function onSubmit(token) {
  if (rsPosted) return;
  rsPosted = true;
  var f = document.getElementById("rscaptcha");

}
</script>

<body style="background-color:#555;">
<form id="rscaptcha" method="post" action="/ss/?sort=cnt&amp;lowts=1" style="padding:40px;text-align:center;">

</form>
</body>
</html>
