<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사망 장면 수집</title><style>body{margin:0;background:#10151d;color:#eef3fa;font:16px system-ui;padding:16px}h1{font-size:20px;margin:0 0 8px}p{color:#c5cedb;font-size:14px}img{display:block;width:100%;height:auto;margin-top:12px}nav{display:flex;align-items:center;gap:12px}input{flex:1}button{padding:8px 14px;cursor:pointer}output{min-width:105px}</style><h1>사망 전후 · 실제 스크린샷</h1><p>NOTE</p><nav><button id="prev">이전</button><input id="seek" aria-label="촬영 시각" type="range" min="0"><button id="next">다음</button><output id="stamp"></output></nav><img id="shot" alt="저장된 게임 화면"><script>const frames=FRAMES;const seek=document.getElementById('seek');seek.max=frames.length-1;seek.value=seek.max;function show(){const f=frames[+seek.value];document.getElementById('shot').src=f.src;document.getElementById('stamp').textContent=f.t.toFixed(3)+'초 · '+(+seek.value+1)+'/'+frames.length}seek.oninput=show;document.getElementById('prev').onclick=()=>{seek.value=Math.max(0,+seek.value-1);show()};document.getElementById('next').onclick=()=>{seek.value=Math.min(frames.length-1,+seek.value+1);show()};show();</script></html>
